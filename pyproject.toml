[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valeo_routing"
version = "0.1.0"
description = "Fleet routing demo on synthetic data (Valeo Health case rebuild)"
requires-python = ">=3.9"
dependencies = ["pydantic-settings>=2,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
valeo-gen = "valeo_routing.datagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
